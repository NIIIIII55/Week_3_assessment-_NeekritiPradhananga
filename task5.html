<html lang="en">

  <title>Table</title>
</head>
<body>

        <tr>
          <td>Sunday</td>
          <td>LSF</td>
          <td rowspan="7">break</td>
          <td>Maths</td>
        </tr>
        <tr>
          <td>Monday</td>

          <td>Maths</td>
        </tr>
        <tr>

          <td>Maths</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>LSF</td>
          <td>Maths</td>
        </tr>
        <tr>
          <td>Thursday</td>
          <td>LSF</td>
          <td>Maths</td>
        </tr>
        <tr>
          <td>Friday</td>
          <td>LSF</td>
          <td>Maths</td>
        </tr>
        <tr>
          <td>Saturday</td>
          <td>LSF</td>
          <td>Maths</td>
        </tr>
      </tbody> 
    </thead>
  </table>
</body>
</html>
